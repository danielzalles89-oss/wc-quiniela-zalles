          const PROJECT_ID = 'wc-quiniela-4d474';
          const API_KEY = 'AIzaSyAE_GXAmfPbKtQsHRVZl28zitk3oYHfSWI';
          const UID = 'ooeLmeDHwiQOScHZxsTNFlTpYMx1';
          const PICKS = {"G1": {"h": "2", "a": "0"}, "G2": {"h": "1", "a": "1"}, "G3": {"h": "2", "a": "1"}, "G4": {"h": "1", "a": "0"}, "G5": {"h": "0", "a": "2"}, "G6": {"h": "1", "a": "1"}, "G7": {"h": "0", "a": "2"}, "G8": {"h": "0", "a": "0"}, "G9": {"h": "4", "a": "0"}, "G10": {"h": "2", "a": "1"}, "G11": {"h": "1", "a": "1"}, "G12": {"h": "2", "a": "0"}, "G13": {"h": "3", "a": "0"}, "G14": {"h": "2", "a": "0"}, "G15": {"h": "0", "a": "2"}, "G16": {"h": "1", "a": "1"}, "G17": {"h": "2", "a": "0"}, "G18": {"h": "0", "a": "2"}, "G19": {"h": "2", "a": "0"}, "G20": {"h": "1", "a": "0"}, "G21": {"h": "2", "a": "0"}, "G22": {"h": "0", "a": "1"}, "G23": {"h": "1", "a": "0"}, "G24": {"h": "0", "a": "1"}, "G25": {"h": "1", "a": "1"}, "G26": {"h": "2", "a": "0"}, "G27": {"h": "1", "a": "0"}, "G28": {"h": "2", "a": "0"}, "G29": {"h": "1", "a": "1"}, "G30": {"h": "1", "a": "0"}, "G31": {"h": "2", "a": "0"}, "G32": {"h": "2", "a": "1"}, "G33": {"h": "2", "a": "0"}, "G34": {"h": "2", "a": "0"}, "G35": {"h": "1", "a": "0"}, "G36": {"h": "1", "a": "1"}, "G37": {"h": "2", "a": "1"}, "G38": {"h": "1", "a": "1"}, "G39": {"h": "2", "a": "0"}, "G40": {"h": "2", "a": "0"}, "G41": {"h": "2", "a": "1"}, "G42": {"h": "0", "a": "1"}, "G43": {"h": "2", "a": "0"}, "G44": {"h": "1", "a": "0"}, "G45": {"h": "2", "a": "1"}, "G46": {"h": "2", "a": "0"}, "G47": {"h": "2", "a": "0"}, "G48": {"h": "2", "a": "0"}, "G49": {"h": "1", "a": "1"}, "G50": {"h": "2", "a": "0"}, "G51": {"h": "0", "a": "2"}, "G52": {"h": "2", "a": "0"}, "G53": {"h": "2", "a": "1"}, "G54": {"h": "1", "a": "1"}, "G55": {"h": "1", "a": "2"}, "G56": {"h": "1", "a": "1"}, "G57": {"h": "0", "a": "4"}, "G58": {"h": "1", "a": "1"}, "G59": {"h": "0", "a": "3"}, "G60": {"h": "1", "a": "1"}, "G61": {"h": "0", "a": "2"}, "G62": {"h": "2", "a": "0"}, "G63": {"h": "0", "a": "1"}, "G64": {"h": "0", "a": "1"}, "G65": {"h": "1", "a": "1"}, "G66": {"h": "0", "a": "2"}, "G67": {"h": "0", "a": "3"}, "G68": {"h": "2", "a": "1"}, "G69": {"h":