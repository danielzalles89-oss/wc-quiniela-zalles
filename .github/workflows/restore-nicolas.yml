          function toFS(val) {
            if (val === null || val === undefined) return {nullValue: null};
            if (typeof val === 'string') return {stringValue: val};
            if (typeof val === 'object') {
              const fields = {};
              for (const [k,v] of Object.entries(val)) fields[k] = toFS(v);
              return {mapValue: {fields}};
            }
            return {stringValue: String(val)};
          }

          const fields = {};
          for (const [k,v] of Object.entries(PICKS)) fields[k] = toFS(v);
          const body = JSON.stringify({fields});

          const req = https.request({
            hostname: 'firestore.googleapis.com',
            path: `/v1/projects/${PROJECT_ID}/databases/(default)/documents/predictions/${UID}?key=${API_KEY}`,
            method: 'PATCH',
            headers: {'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body)}
          }, r => {
            let d = '';
            r.on('data', c => d += c);
            r.on('end', () => {
              console.log('Status:', r.statusCode);
              if (r.statusCode === 200) {
                console.log('✅ Nicolas picks restored successfully!');
              } else {
                console.error('❌ Error:', d.substring(0, 200));
              }
            });
          });
          req.on('error', e => console.error(e));
          req.write(body);
          req.end();
          NODESCRIPT
